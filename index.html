<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق ذكر - التذكير بالصلاة على النبي</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .phone-container {
            width: 360px;
            height: 640px;
            background: white;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 8px solid #333;
        }
        .app-header {
            background-color: #3f51b5;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }
        .app-content {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            justify-content: center;
            align-items: center;
        }
        .form-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        label {
            font-size: 14px;
            color: #666;
            font-weight: bold;
        }
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        select:focus {
            border-color: #3f51b5;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-start {
            background-color: #4caf50;
            color: white;
        }
        .btn-start:hover {
            background-color: #45a049;
        }
        .btn-stop {
            background-color: #f44336;
            color: white;
        }
        .btn-stop:hover {
            background-color: #da190b;
        }
        .status-text {
            margin-top: 10px;
            font-size: 14px;
            color: #2196f3;
            font-weight: bold;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <div class="app-header">تطبيق ذِكْر</div>
        
        <div class="app-content">
            <div class="form-group">
                <label>اختر مدة التذكير:</label>
                <select id="spinnerTime">
                    <option value="300000">5 دقائق</option>
                    <option value="600000">10 دقائق</option>
                    <option value="900000">15 دقيقة</option>
                    <option value="1200000">20 دقيقة</option>
                    <option value="1500000">25 دقيقة</option>
                    <option value="1800000">30 دقيقة</option>
                </select>
            </div>

            <div class="form-group">
                <label>اختر صوت التذكير:</label>
                <select id="spinnerAudio">
                    <option value="1.mp3">الصوت الأول</option>
                    <option value="2.mp3">الصوت الثاني</option>
                    <option value="3.mp3">الصوت الثالث</option>
                </select>
            </div>

            <button class="btn btn-start" id="btnStart">تفعيل التذكير</button>
            <button class="btn btn-stop" id="btnStop">إيقاف التذكير</button>

            <div class="status-text" id="statusMessage">التذكير متوقف حالياً</div>
        </div>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        let timerInterval = null;
        const audioPlayer = document.getElementById('audioPlayer');
        const statusMessage = document.getElementById('statusMessage');

        // زر التفعيل (Button1.Click)
        document.getElementById('btnStart').addEventListener('click', () => {
            // إيقاف أي عداد قديم شغال عشان ميتداخلوش
            clearInterval(timerInterval);

            const selectedTime = parseInt(document.getElementById('spinnerTime').value);
            const selectedAudio = document.getElementById('spinnerAudio').value;

            statusMessage.style.color = '#4caf50';
            statusMessage.innerText = 'تم تفعيل التذكير بنجاح ⏱️';

            // تشغيل الـ الـ Clock (Timer)
            timerInterval = setInterval(() => {
                // تحديد ملف الصوت (set Player.Source)
                audioPlayer.src = selectedAudio;
                // تشغيل الصوت (call Player.Start)
                audioPlayer.play().catch(err => {
                    console.log("المتصفح يحتاج تفاعل من المستخدم لتشغيل الصوت أول مرة:", err);
                });
            }, selectedTime);
        });

        // زر الإيقاف (Button2.Click)
        document.getElementById('btnStop').addEventListener('click', () => {
            // إيقاف العداد (set Clock.TimerEnabled to false)
            clearInterval(timerInterval);
            // إيقاف الصوت (call Player.Stop)
            audioPlayer.pause();
            audioPlayer.currentTime = 0;

            statusMessage.style.color = '#f44336';
            statusMessage.innerText = 'تم إيقاف التذكير 🛑';
        });
    </script>
</body>
