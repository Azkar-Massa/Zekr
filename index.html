<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق ذِكْر الصلاة علي النبي ﷺ</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f1;
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .main-container {
            width: 90%; max-width: 600px; background: #ffffff;
            border-radius: 16px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            padding: 30px; box-sizing: border-box;
        }
        .main-title { color: #2e7d32; text-align: center; font-size: 28px; font-weight: bold; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #666; font-size: 15px; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 15px; font-weight: 600; color: #333; margin-bottom: 8px; }
        select { width: 100%; padding: 12px 15px; border: 2px solid #cbd5e1; border-radius: 8px; font-size: 16px; outline: none; }
        .buttons-group { display: flex; gap: 15px; margin-top: 25px; }
        .btn { flex: 1; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-start { background-color: #2e7d32; color: white; }
        .btn-stop { background-color: #d32f2f; color: white; }
        .status-box { margin-top: 25px; padding: 15px; border-radius: 8px; text-align: center; font-size: 15px; font-weight: bold; background-color: #f8fafc; border: 1px solid #e2e8f0; color: #64748b; }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="main-title">🌟 ذِكْر الصلاة على النبي ﷺ</div>
        <div class="subtitle">نظام التذكير الفوري الصوتي - يعمل في الخلفية والشاشة مقفولة</div>
        
        <div class="form-group">
            <label for="timeSelect">حدد الفاصل الزمني للتذكير:</label>
            <select id="timeSelect">
                <option value="10000">كل 10 ثوانٍ (للتجربة الفورية)</option>
                <option value="30000">كل 30 ثانية</option>
                <option value="300000">كل 5 دقائق</option>
                <option value="600000">كل 10 دقائق</option>
            </select>
        </div>

        <div class="form-group">
            <label for="audioSelect">اختر صوت التذكير:</label>
            <select id="audioSelect">
                <option value="1.mp3">الصوت الأول</option>
                <option value="2.mp3">الصوت الثاني</option>
                <option value="3.mp3">الصوت الثالث</option>
            </select>
        </div>

        <div class="buttons-group">
            <button class="btn btn-start" id="startTrigger">تفعيل التذكير 🔔</button>
            <button class="btn btn-stop" id="stopTrigger">إيقاف التذكير 🛑</button>
        </div>

        <div class="status-box" id="statusDisplay">انتظار طلب صلاحية الإشعارات...</div>
    </div>

    <audio id="globalPlayer"></audio>

    <script>
        const player = document.getElementById('globalPlayer');
        const statusBox = document.getElementById('statusDisplay');
        const audioSelect = document.getElementById('audioSelect');

        // تسجيل الـ Service Worker وطلب الصلاحية
        if ('serviceWorker' in navigator && 'PushManager' in window) {
            navigator.serviceWorker.register('sw.js')
            .then(reg => {
                return Notification.requestPermission();
            })
            .then(permission => {
                if (permission === 'granted') {
                    statusBox.innerText = '✅ تم تفعيل النظام بنجاح وجاهز للعمل أوفلاين';
                } else {
                    statusBox.innerText = '❌ يرجى السماح بالإشعارات لتشغيل الصوت والشاشة مقفولة';
                }
            }).catch(err => console.log('SW Error:', err));
        }

        // استقبال الإشارة من الـ Service Worker لتشغيل الصوت فوراً بالخلفية
        navigator.serviceWorker.addEventListener('message', event => {
            if (event.data.action === 'playSound') {
                player.src = event.data.audio;
                player.play().catch(e => console.log("حجب المتصفح التلقائي:", e));
            }
        });

        // زر البدء
        document.getElementById('startTrigger').addEventListener('click', () => {
            const timeInterval = parseInt(document.getElementById('timeSelect').value);
            const audioSource = audioSelect.value;

            if (Notification.permission !== 'granted') {
                alert('يجب الموافقة على صلاحية الإشعارات أولاً من إعدادات المتصفح!');
                return;
            }

            statusBox.style.backgroundColor = '#e8f5e9';
            statusBox.style.color = '#2e7d32';
            statusBox.innerText = '⏱️ التذكير نشط (اقفل الشاشة الآن وسيعمل كل 5 دقائق)';

            // تفعيل الصوت المبدئي لتفادي حظر المتصفح
            player.src = audioSource;
            player.play().then(() => player.pause()).catch(e => console.log(e));

            if (navigator.serviceWorker.controller) {
                navigator.serviceWorker.controller.postMessage({
                    action: 'startTimer',
                    interval: timeInterval,
                    audio: audioSource
                });
            }
        });

        // زر الإيقاف
        document.getElementById('stopTrigger').addEventListener('click', () => {
            if (navigator.serviceWorker.controller) {
                navigator.serviceWorker.controller.postMessage({ action: 'stopTimer' });
            }
            player.pause();
            statusBox.style.backgroundColor = '#ffebee';
            statusBox.style.color = '#c62828';
            statusBox.innerText = '🛑 تم إيقاف التذكير';
        });
    </script>
</body>
</html>
